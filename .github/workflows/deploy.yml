name: ZKWAConnect CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "8"

jobs:
  # ── CI: Lint + Type Check + Test ─────────────────────────────
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with: { version: ${{ env.PNPM_VERSION }} }

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: cd packages/db && npx prisma generate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

      - name: Type check API
        run: cd apps/api && npx tsc --noEmit

      - name: Type check Web
        run: cd apps/web && npx tsc --noEmit

      - name: Run unit tests
        run: pnpm test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

  # ── Build check ──────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with: { version: ${{ env.PNPM_VERSION }} }
      - uses: actions/setup-node@v4
        with: { node-version: ${{ env.NODE_VERSION }}, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: cd packages/db && npx prisma generate
        env: { DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }} }
      - run: pnpm --filter api build
      - run: pnpm --filter web build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.STAGING_NEXT_PUBLIC_API_URL }}

  # ── Staging: Migrate Neon + Deploy Railway + Vercel ──────────
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with: { version: ${{ env.PNPM_VERSION }} }
      - uses: actions/setup-node@v4
        with: { node-version: ${{ env.NODE_VERSION }}, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      - name: Migrate staging database (Neon)
        run: cd packages/db && npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

      - name: Set Railway API environment variables
        run: |
          npm install -g @railway/cli
          railway variables set \
            DATABASE_URL="${{ secrets.STAGING_DATABASE_URL }}" \
            JWT_SECRET="${{ secrets.STAGING_JWT_SECRET }}" \
            NODE_ENV="production" \
            PORT="4000" \
            FRONTEND_URL="${{ secrets.STAGING_FRONTEND_URL }}" \
            META_APP_ID="${{ secrets.STAGING_META_APP_ID }}" \
            META_APP_SECRET="${{ secrets.STAGING_META_APP_SECRET }}" \
            META_VERIFY_TOKEN="${{ secrets.STAGING_META_VERIFY_TOKEN }}" \
            TWILIO_ACCOUNT_SID="${{ secrets.STAGING_TWILIO_ACCOUNT_SID }}" \
            TWILIO_AUTH_TOKEN="${{ secrets.STAGING_TWILIO_AUTH_TOKEN }}" \
            TWILIO_PHONE_NUMBER="${{ secrets.STAGING_TWILIO_PHONE_NUMBER }}" \
            RAZORPAY_KEY_ID="${{ secrets.STAGING_RAZORPAY_KEY_ID }}" \
            RAZORPAY_KEY_SECRET="${{ secrets.STAGING_RAZORPAY_KEY_SECRET }}" \
            RAZORPAY_WEBHOOK_SECRET="${{ secrets.STAGING_RAZORPAY_WEBHOOK_SECRET }}" \
            RESEND_API_KEY="${{ secrets.STAGING_RESEND_API_KEY }}" \
            OUR_GSTIN="33AABCZ1234A1Z5" \
            OUR_STATE="Tamil Nadu" \
            LOG_LEVEL="info" \
            --service ${{ secrets.RAILWAY_API_SERVICE_ID }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy API to Railway (staging)
        run: |
          npm install -g @railway/cli
          railway up --service ${{ secrets.RAILWAY_API_SERVICE_ID }} --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy Worker to Railway (staging)
        run: railway up --service ${{ secrets.RAILWAY_WORKER_SERVICE_ID }} --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy Web to Vercel (staging)
        run: |
          npm install -g vercel
          cd apps/web && vercel deploy --token ${{ secrets.VERCEL_TOKEN }} --scope ${{ secrets.VERCEL_ORG_ID }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
