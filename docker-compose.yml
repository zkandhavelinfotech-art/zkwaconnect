version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: zkwaconnect-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: zkwaconnect
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./prisma/schema-mysql.sql:/docker-entrypoint-initdb.d/init.sql

  zkwaconnect:
    build: .
    container_name: zkwaconnect-app
    restart: always
    ports:
      - "3002:3002"
    environment:
      DATABASE_URL: "mysql://root:password@mysql:3306/zkwaconnect"
      NODE_ENV: "production"
      PORT: "3002"
      NEXT_PUBLIC_APP_URL: "https://app.zkwaconnect.in"
      NEXT_PUBLIC_API_URL: "https://api.zkwaconnect.in/api/v1"
      NEXT_PUBLIC_MARKETING_URL: "https://zkwaconnect.in"
    depends_on:
      - mysql

volumes:
  mysql_data:

