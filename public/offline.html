<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#075E54" />
  <title>Offline · ZKWAConnect</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #efeae2; font-family: system-ui, -apple-system, Segoe UI, sans-serif; color: #111b21; }
    main { text-align: center; padding: 24px; max-width: 360px; }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { font-size: 20px; margin: 16px 0 8px; }
    p { color: #54656f; font-size: 14px; line-height: 1.5; }
    button { margin-top: 12px; border: 0; border-radius: 8px; padding: 10px 18px; background: #075e54; color: #fff; font-weight: 700; font-size: 14px; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/zkwaconnect-icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>ZKWAConnect needs an internet connection to load your chats. We'll be right here when you're back online.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
