<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">

  <!-- Card background deep green -->
  <rect x="0" y="0" width="1024" height="1024" rx="196" fill="#075E54"/>

  <!-- Inner shimmer top half -->
  <rect x="0" y="0" width="1024" height="520" rx="196" fill="#128C7E"/>
  <rect x="0" y="440" width="1024" height="80" fill="#128C7E"/>

  <!-- Decorative rings background -->
  <circle cx="880" cy="140"  r="300" fill="none" stroke="#0A7A6E" stroke-width="60"/>
  <circle cx="160" cy="860"  r="200" fill="none" stroke="#0A7A6E" stroke-width="44"/>

  <!-- Subtle circle behind monogram -->
  <circle cx="512" cy="420" r="280" fill="#064E45" opacity="0.35"/>

  <!-- ZK monogram -->
  <!-- Z -->
  <text x="162" y="590"
    font-family="Arial,Helvetica,sans-serif"
    font-size="420" font-weight="700"
    fill="#FFFFFF" opacity="0.97">Z</text>
  <!-- K -->
  <text x="490" y="590"
    font-family="Arial,Helvetica,sans-serif"
    font-size="420" font-weight="700"
    fill="#25D366">K</text>

  <!-- Double tick checkmark — WhatsApp read-receipt style -->
  <!-- tick 1 (white / sent) -->
  <path d="M290 730 L390 860 L620 590"
    fill="none" stroke="#FFFFFF" stroke-width="38"
    stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>
  <!-- tick 2 (green / read) -->
  <path d="M420 730 L520 860 L750 590"
    fill="none" stroke="#25D366" stroke-width="38"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bottom band -->
  <rect x="0" y="820" width="1024" height="204" rx="0" fill="#054840"/>
  <rect x="0" y="848" width="1024" height="176" rx="196" fill="#054840"/>
  <rect x="0" y="820" width="1024" height="60"  fill="#054840"/>

  <!-- WACONNECT wordmark -->
  <text x="512" y="910"
    font-family="Arial,Helvetica,sans-serif"
    font-size="72" font-weight="700"
    fill="#FFFFFF" text-anchor="middle" letter-spacing="18" opacity="0.93">WACONNECT</text>

  <!-- Business API label -->
  <text x="512" y="980"
    font-family="Arial,Helvetica,sans-serif"
    font-size="52" font-weight="400"
    fill="#25D366" text-anchor="middle" letter-spacing="10" opacity="0.9">Business API</text>

  <!-- Signal dots -->
  <circle cx="360" cy="660" r="14" fill="#25D366" opacity="0.8"/>
  <circle cx="410" cy="660" r="14" fill="#25D366" opacity="0.5"/>
  <circle cx="460" cy="660" r="14" fill="#25D366" opacity="0.25"/>

</svg>
