version: "3.9"

x-logging: &logging
  driver: "json-file"
  options: { max-size: "10m", max-file: "3" }

services:
  postgres:
    image: postgres:16-alpine
    container_name: zkwa_postgres_development
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${DB_USER:-zkwa}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-zkwa_password}
      POSTGRES_DB:       ${DB_NAME:-zkwaconnect}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - zkwa_postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-zkwa}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  redis:
    image: redis:7-alpine
    container_name: zkwa_redis_development
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - zkwa_redis_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
    logging: *logging

volumes:
  zkwa_postgres_dev:
    name: zkwa_postgres_development_data
  zkwa_redis_dev:
    name: zkwa_redis_development_data
