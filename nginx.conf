# ============================================================
# ZKWAConnect v6 — NGINX Reverse Proxy Configuration
# ============================================================

# 1. Marketing SaaS Website & Super Admin (zkwaconnect.in)
server {
    listen 80;
    listen 443 ssl http2;
    server_name zkwaconnect.in www.zkwaconnect.in;

    # SSL Certificates (Let's Encrypt / Certbot)
    # ssl_certificate /etc/letsencrypt/live/zkwaconnect.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/zkwaconnect.in/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. Customer WhatsApp Platform (app.zkwaconnect.in)
