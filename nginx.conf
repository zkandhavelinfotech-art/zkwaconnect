# 3. Public REST API & Webhooks Engine (api.zkwaconnect.in)
server {
    listen 80;
    listen 443 ssl http2;
    server_name api.zkwaconnect.in;

    # ssl_certificate /etc/letsencrypt/live/api.zkwaconnect.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.zkwaconnect.in/privkey.pem;

    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

